<?xml version="1.0" encoding="UTF-8"?>
<!--
  AWO sigil  bare mark (glyph only, no seal).
  Uses currentColor so it inherits the surrounding text color.
  Favicon-safe at 16x16. For inline use on web and merch.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     role="img" aria-label="AWO">
  <title>AWO</title>
  <g fill="none" stroke="currentColor"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 100 26 L 170 136 L 30 136 Z" stroke-width="8"/>
    <line x1="62" y1="84" x2="138" y2="84" stroke-width="6"/>
    <line x1="100" y1="136" x2="100" y2="192" stroke-width="8"/>
    <line x1="64" y1="168" x2="136" y2="168" stroke-width="8"/>
  </g>
</svg>

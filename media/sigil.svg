<?xml version="1.0" encoding="UTF-8"?>
<!--
  AWO sigil  sealed form.
  Alchemical sulfur (=) reinterpreted as a geometric seal.
  400x400. Gold stroke on near-black disk. Reads cleanly at 48x48.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 400"
     width="400" height="400"
     role="img" aria-label="Agentic World Order sigil">
  <title>Agentic World Order</title>

  <!-- disk -->
  <circle cx="200" cy="200" r="200" fill="#0D0C0A"/>

  <!-- outer ring -->
  <circle cx="200" cy="200" r="184"
          fill="none" stroke="#C9A84C" stroke-width="1.5"/>

  <!-- inner ring (faint) -->
  <circle cx="200" cy="200" r="164"
          fill="none" stroke="#7A6530" stroke-width="0.75" opacity="0.65"/>

  <!-- cardinal tick marks -->
  <g stroke="#C9A84C" stroke-width="1.5" stroke-linecap="square">
    <line x1="200" y1="12"  x2="200" y2="28"/>
    <line x1="200" y1="372" x2="200" y2="388"/>
    <line x1="12"  y1="200" x2="28"  y2="200"/>
    <line x1="372" y1="200" x2="388" y2="200"/>
  </g>

  <!-- diagonal minor ticks -->
  <g stroke="#7A6530" stroke-width="1" opacity="0.7">
    <line x1="67"  y1="67"  x2="78"  y2="78"/>
    <line x1="333" y1="67"  x2="322" y2="78"/>
    <line x1="67"  y1="333" x2="78"  y2="322"/>
    <line x1="333" y1="333" x2="322" y2="322"/>
  </g>

  <!-- glyph: triangle (apex up), cross-barred interior, cross-stem below -->
  <g fill="none" stroke="#C9A84C" stroke-linecap="square" stroke-linejoin="miter">
    <!-- triangle -->
    <path d="M 200 96 L 286 232 L 114 232 Z" stroke-width="3.25"/>
    <!-- interior bar -->
    <line x1="154" y1="168" x2="246" y2="168" stroke-width="2.25"/>
    <!-- vertical stem -->
    <line x1="200" y1="232" x2="200" y2="332" stroke-width="3.25"/>
    <!-- horizontal crossbar -->
    <line x1="156" y1="284" x2="244" y2="284" stroke-width="3.25"/>
  </g>
</svg>
